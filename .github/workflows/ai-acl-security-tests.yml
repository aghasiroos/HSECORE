name: AI ACL Security Tests

on:
  push:
    branches:
      - security/p0-ai-acl-org-tests
  pull_request:
    branches:
      - main
    paths:
      - 'server/modules/ai/**'
      - 'server/core/middleware/auth.ts'
      - 'scripts/test-ai-acl.ts'
      - 'package.json'
      - 'package-lock.json'

jobs:
  ai-acl:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run document ACL regression tests
        run: npm run test:ai-acl
      - name: TypeScript validation
        run: npm run lint
