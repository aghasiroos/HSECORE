name: AI ACL Security Tests

on:
  push:
    branches:
      - main
      - security/p0-ai-acl-org-tests
    paths:
      - 'server/modules/ai/**'
      - 'server/core/middleware/auth.ts'
      - 'server/core/middleware/security.ts'
      - 'scripts/test-ai-acl.ts'
      - 'scripts/test-ai-auth.ts'
      - 'scripts/test-ai-rag-db.ts'
      - 'scripts/test-ai-routes.ts'
      - 'scripts/test-ai-queue.ts'
      - 'scripts/test-ai-model-pull.ts'
      - 'index.html'
      - '.env.example'
      - 'install.sh'
      - 'scripts/manage-ai.sh'
      - 'scripts/setup-local-ai.sh'
      - 'scripts/start-ai-if-enabled.sh'
      - 'scripts/build-windows-icon.js'
      - 'Dockerfile.prod'
      - 'docker-compose*.yml'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/ai-acl-security-tests.yml'
      - 'docs/PHASE2_SPARK_X2_6_DEPLOYMENT.md'
  pull_request:
    branches:
      - main
    paths:
      - 'server/modules/ai/**'
      - 'server/core/middleware/auth.ts'
      - 'server/core/middleware/security.ts'
      - 'scripts/test-ai-acl.ts'
      - 'scripts/test-ai-auth.ts'
      - 'scripts/test-ai-rag-db.ts'
      - 'scripts/test-ai-routes.ts'
      - 'scripts/test-ai-queue.ts'
      - 'scripts/test-ai-model-pull.ts'
      - 'index.html'
      - '.env.example'
      - 'install.sh'
      - 'scripts/manage-ai.sh'
      - 'scripts/setup-local-ai.sh'
      - 'scripts/start-ai-if-enabled.sh'
      - 'scripts/build-windows-icon.js'
      - 'Dockerfile.prod'
      - 'docker-compose*.yml'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/ai-acl-security-tests.yml'
      - 'docs/PHASE2_SPARK_X2_6_DEPLOYMENT.md'
  workflow_dispatch:

concurrency:
  group: ai-acl-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ai-acl:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: hsecore_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: hsecore_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d hsecore_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      NODE_ENV: test
      SQL_HOST: 127.0.0.1
      SQL_PORT: 5432
      SQL_USER: postgres
      SQL_PASSWORD: hsecore_test_password
      SQL_DB_NAME: hsecore_test
      SQL_SSL: 'false'
      JWT_SECRET: ci-only-hsecore-ai-acl-jwt-secret-at-least-32-characters
      AI_ENGINE_URL: http://127.0.0.1:1
      AI_ACL_DB_TEST: 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Verify local spreadsheet libraries and restrictive CSP
        run: |
          node -e "const p=require('./package-lock.json').packages; if (p['node_modules/xlsx']?.version !== '0.20.3') process.exit(1)"
          grep -Fq "from 'xlsx'" src/services/personnelImportService.ts
          node <<'NODE'
          const fs = require('node:fs');
          const html = fs.readFileSync('index.html', 'utf8');
          if (html.includes('<script src="https://') || html.includes("<script src='https://")) {
            throw new Error('Executable third-party libraries must be bundled locally, not loaded from CDNs.');
          }
          const csp = fs.readFileSync('server/core/middleware/security.ts', 'utf8');
          for (const origin of ['https://fonts.googleapis.com', 'https://fonts.gstatic.com', 'https://mt0.google.com', 'https://*.tile.openstreetmap.org']) {
            if (!csp.includes(origin)) throw new Error('Missing required CSP origin: ' + origin);
          }
          NODE
      - name: Audit production dependencies for moderate or higher vulnerabilities
        run: npm audit --omit=dev --audit-level=moderate
      - name: Audit npm dependencies for high-severity vulnerabilities
        run: npm audit --audit-level=high
      - name: Run document ACL and prompt-security regression tests
        run: npm run test:ai-acl
      - name: Run JWT authentication regression tests
        run: npm run test:ai-auth
      - name: Run PostgreSQL RAG integration tests
        run: npm run test:ai-rag-db
      - name: Run AI knowledge HTTP authorization tests
        run: npm run test:ai-routes
      - name: AI request queue regression tests
        run: npm run test:ai-queue
      - name: AI model pull validation and Ollama API regression tests
        run: npm run test:ai-model-pull
      - name: Validate production Compose configurations
        run: |
          cat > .env <<'EOF'
          SQL_USER=postgres
          SQL_PASSWORD=hsecore_test_password
          SQL_DB_NAME=hsecore_test
          JWT_SECRET=ci-only-hsecore-ai-acl-jwt-secret-at-least-32-characters
          AI_CLOUD_FALLBACK_ENABLED=false
          EOF
          docker compose -f docker-compose.server.yml config --quiet
          docker compose -f docker-compose.ai.yml config --quiet
      - name: Verify icon generation does not recreate duplicate aliases
        run: |
          if grep -En 'copyFileSync.*icon-(192|512)\.png' scripts/build-windows-icon.js; then
            echo "Duplicate icon aliases must not be generated."
            exit 1
          fi
      - name: Validate installer shell syntax and prohibit remote shell execution
        run: |
          bash -n install.sh scripts/manage-ai.sh scripts/setup-local-ai.sh scripts/start-ai-if-enabled.sh
          if grep -EnE '(curl|wget)[^#]*[|][[:space:]]*(sudo[[:space:]]+)?(ba)?sh' install.sh; then
            echo "Remote downloaded scripts must not be piped directly into a shell."
            exit 1
          fi
      - name: Verify safe AI runtime management
        run: |
          grep -Fq 'COMPOSE_FILE="docker-compose.server.yml"' scripts/manage-ai.sh
          if grep -Rq 'AI_ALLOWED_MODELS\|allowlisted model' scripts/manage-ai.sh server/modules/ai/ai.local-provider.ts server/core/config.ts .env.example; then
            echo "Model downloads must not be restricted by a fixed allowlist."
            exit 1
          fi
          if grep -Fq 'Enter model tag [default:' install.sh || grep -Fq 'target_m="${target_m:-' install.sh; then
            echo "The model download menu must not preselect a model."
            exit 1
          fi
          grep -Fq 'No default model is selected.' install.sh
          grep -Fq "const [pullModelName, setPullModelName] = useState<string>('');" src/components/system-settings/AiManagementTab.tsx
          grep -Fq 'JSON.stringify({ model: normalized, stream: true })' server/modules/ai/ai.local-provider.ts
          grep -Fq 'JSON.stringify({ model: normalized })' server/modules/ai/ai.local-provider.ts
          grep -Fq 'Type DELETE to confirm' scripts/manage-ai.sh
          grep -Fq 'verify_container_compose_owner' scripts/manage-ai.sh
          if grep -Fq 'ollama pull' scripts/setup-local-ai.sh; then
            echo "Runtime verification must not download models implicitly."
            exit 1
          fi
          grep -Fq 'up -d --no-deps hse-ai-engine' scripts/setup-local-ai.sh
          grep -Fq 'AI_ENGINE_ENABLED=false' .env.example
          grep -Fq 'ensure_env_key "AI_ENGINE_ENABLED" "false"' scripts/setup-local-ai.sh
          grep -Fq 'local current="false"' scripts/manage-ai.sh
          grep -Fq 'verify_container_compose_owner || return 1' scripts/manage-ai.sh
          grep -Fq 'profiles:' docker-compose.server.yml
          grep -Fq 'ExecStartPost=/bin/bash' install.sh
          grep -Fq 'AI_ENGINE_ENABLED' scripts/start-ai-if-enabled.sh
      - name: TypeScript validation
        run: npm run lint
      - name: Production build validation
        run: npm run build
      - name: Build and verify production Docker image provenance
        run: |
          docker build --pull \
            --build-arg GIT_COMMIT="$GITHUB_SHA" \
            --build-arg BUILD_ID="ci-$GITHUB_RUN_ID" \
            --build-arg RELEASE_ID="ci-$GITHUB_RUN_NUMBER" \
            --tag "hsecore-ci:$GITHUB_SHA" \
            --file Dockerfile.prod .
          test "$(docker image inspect "hsecore-ci:$GITHUB_SHA" --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')" = "$GITHUB_SHA"
