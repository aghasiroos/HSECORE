name: AI ACL Security Tests

on:
  push:
    branches:
      - main
      - security/p0-ai-acl-org-tests
    paths:
      - 'server/modules/ai/**'
      - 'server/core/middleware/auth.ts'
      - 'scripts/test-ai-acl.ts'
      - 'scripts/test-ai-auth.ts'
      - 'scripts/test-ai-rag-db.ts'
      - 'scripts/test-ai-routes.ts'
      - 'scripts/test-ai-queue.ts'
      - 'index.html'
      - '.env.example'
      - 'install.sh'
      - 'scripts/build-windows-icon.js'
      - 'Dockerfile.prod'
      - 'docker-compose*.yml'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/ai-acl-security-tests.yml'
      - 'docs/PHASE2_SPARK_X2_6_DEPLOYMENT.md'
  pull_request:
    branches:
      - main
    paths:
      - 'server/modules/ai/**'
      - 'server/core/middleware/auth.ts'
      - 'scripts/test-ai-acl.ts'
      - 'scripts/test-ai-auth.ts'
      - 'scripts/test-ai-rag-db.ts'
      - 'scripts/test-ai-routes.ts'
      - 'scripts/test-ai-queue.ts'
      - 'index.html'
      - '.env.example'
      - 'install.sh'
      - 'scripts/build-windows-icon.js'
      - 'Dockerfile.prod'
      - 'docker-compose*.yml'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/ai-acl-security-tests.yml'
      - 'docs/PHASE2_SPARK_X2_6_DEPLOYMENT.md'
  workflow_dispatch:

concurrency:
  group: ai-acl-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ai-acl:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: hsecore_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: hsecore_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d hsecore_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      NODE_ENV: test
      SQL_HOST: 127.0.0.1
      SQL_PORT: 5432
      SQL_USER: postgres
      SQL_PASSWORD: hsecore_test_password
      SQL_DB_NAME: hsecore_test
      SQL_SSL: 'false'
      JWT_SECRET: ci-only-hsecore-ai-acl-jwt-secret-at-least-32-characters
      AI_ENGINE_URL: http://127.0.0.1:1
      AI_ACL_DB_TEST: 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Regenerate lockfile after removing unused glob dependency
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm audit fix --package-lock-only --ignore-scripts --no-fund || true
      - name: Upload generated npm lockfile
        uses: actions/upload-artifact@v4
        with:
          name: hsecore-generated-package-lock
          path: package-lock.json
          if-no-files-found: error
      - name: Commit regenerated package lockfile to PR branch
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'chore/remove-unused-glob-dependency'
        run: |
          cp package-lock.json "$RUNNER_TEMP/package-lock.generated.json"
          git fetch --no-tags origin "$GITHUB_HEAD_REF"
          git checkout -B "$GITHUB_HEAD_REF" FETCH_HEAD
          cp "$RUNNER_TEMP/package-lock.generated.json" package-lock.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "Package lockfile is already up to date."
          else
            git commit -m "chore(deps): remove unused glob dependency tree"
            git push origin "HEAD:$GITHUB_HEAD_REF"
          fi
      - name: Install dependencies
        run: npm ci
      - name: Verify patched spreadsheet dependency
        run: |
          node -e "const p=require('./package-lock.json').packages; if (p['node_modules/xlsx']?.version !== '0.20.3') process.exit(1)"
          grep -Fq 'https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js' index.html
      - name: Audit npm dependencies for high-severity vulnerabilities
        run: npm audit --audit-level=high
      - name: Run document ACL and prompt-security regression tests
        run: npm run test:ai-acl
      - name: Run JWT authentication regression tests
        run: npm run test:ai-auth
      - name: Run PostgreSQL RAG integration tests
        run: npm run test:ai-rag-db
      - name: Run AI knowledge HTTP authorization tests
        run: npm run test:ai-routes
      - name: AI request queue regression tests
        run: npm run test:ai-queue
      - name: Validate production Compose configurations
        run: |
          cat > .env <<'EOF'
          SQL_USER=postgres
          SQL_PASSWORD=hsecore_test_password
          SQL_DB_NAME=hsecore_test
          JWT_SECRET=ci-only-hsecore-ai-acl-jwt-secret-at-least-32-characters
          AI_CLOUD_FALLBACK_ENABLED=false
          EOF
          docker compose -f docker-compose.server.yml config --quiet
          docker compose -f docker-compose.ai.yml config --quiet
      - name: Verify icon generation does not recreate duplicate aliases
        run: |
          if grep -En 'copyFileSync.*icon-(192|512)\.png' scripts/build-windows-icon.js; then
            echo "Duplicate icon aliases must not be generated."
            exit 1
          fi
      - name: Validate installer shell syntax and prohibit remote shell execution
        run: |
          bash -n install.sh
          if grep -EnE '(curl|wget)[^#]*[|][[:space:]]*(sudo[[:space:]]+)?(ba)?sh' install.sh; then
            echo "Remote downloaded scripts must not be piped directly into a shell."
            exit 1
          fi
      - name: TypeScript validation
        run: npm run lint
      - name: Production build validation
        run: npm run build
      - name: Build and verify production Docker image provenance
        run: |
          docker build --pull \
            --build-arg GIT_COMMIT="$GITHUB_SHA" \
            --build-arg BUILD_ID="ci-$GITHUB_RUN_ID" \
            --build-arg RELEASE_ID="ci-$GITHUB_RUN_NUMBER" \
            --tag "hsecore-ci:$GITHUB_SHA" \
            --file Dockerfile.prod .
          test "$(docker image inspect "hsecore-ci:$GITHUB_SHA" --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')" = "$GITHUB_SHA"
