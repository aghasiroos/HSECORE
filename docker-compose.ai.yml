version: '3.8'

# Optional CPU-only Local LLM runtime for HSECORE.
# The Ollama API is reachable only by containers attached to the shared Docker bridge.
# No host port is published; outbound internet is used only when pulling/updating images or models.

services:
  hse-ai-engine:
    image: ollama/ollama:${AI_OLLAMA_VERSION:-0.40.13}
    container_name: hse-ai-engine
    restart: unless-stopped
    init: true
    environment:
      OLLAMA_HOST: "0.0.0.0:11434"
      OLLAMA_NUM_PARALLEL: ${AI_NUM_PARALLEL:-1}
      OLLAMA_MAX_LOADED_MODELS: ${AI_MAX_LOADED_MODELS:-1}
      OLLAMA_MAX_QUEUE: ${AI_MAX_QUEUE:-25}
      OLLAMA_KEEP_ALIVE: ${AI_KEEP_ALIVE:-15m}
      OLLAMA_FLASH_ATTENTION: "0"
      OMP_NUM_THREADS: ${AI_CPU_THREADS:-4}
    volumes:
      - hse_ai_models:/root/.ollama
    expose:
      - "11434"
    deploy:
      resources:
        limits:
          cpus: "${AI_CPU_LIMIT:-4.0}"
          memory: "${AI_MEMORY_LIMIT:-4096M}"
        reservations:
          cpus: "1.0"
          memory: "1024M"
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 45s
    networks:
      - hse-network

networks:
  hse-network:
    external: true
    name: ${DOCKER_NETWORK_NAME:-hse-network}

volumes:
  hse_ai_models:
    name: hse_ai_models
    driver: local
