# ==============================================================================
# HSECORE Enterprise - Dedicated Local AI Engine (Ollama Service)
# Architecture:
# - Completely offline, zero external cloud LLM dependencies
# - Strictly isolated on internal 'hse-network' bridge (No WAN/Internet exposure)
# - CPU and memory limits aligned with the observed 6-CPU / ~11-GiB VPS
# - Persistent Named Volume 'hse_ai_models' to preserve GGUF models across updates
# ==============================================================================

services:
  hse-ai-engine:
    image: ${OLLAMA_IMAGE:-ollama/ollama:0.40.13}
    container_name: hse-ai-engine
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      - "OLLAMA_HOST=0.0.0.0:11434"
      - "OLLAMA_NUM_PARALLEL=${AI_NUM_PARALLEL:-1}"
      - "OLLAMA_MAX_LOADED_MODELS=${AI_MAX_LOADED_MODELS:-1}"
      - "OLLAMA_KEEP_ALIVE=${AI_KEEP_ALIVE:-15m}"
      - "OLLAMA_FLASH_ATTENTION=0"
      - "OLLAMA_ORIGINS="
      - "OMP_NUM_THREADS=${AI_CPU_THREADS:-4}"
    volumes:
      # Persistent volume ensures downloaded models are preserved across HSECORE container updates
      - hse_ai_models:/root/.ollama
    # Expose internally to other containers on hse-network (e.g. hse-app)
    expose:
      - "11434"
    # Bound to local loopback (127.0.0.1) ONLY for local host diagnostics/CLI, strictly hidden from public internet
    ports:
      - "${AI_BIND_IP:-127.0.0.1}:${AI_HOST_PORT:-11434}:11434"
    deploy:
      resources:
        limits:
          cpus: "${AI_CPU_LIMIT:-4.0}"
          memory: "${AI_MEMORY_LIMIT:-4608M}"
        reservations:
          cpus: "1.0"
          memory: "1024M"
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 8s
      retries: 3
      start_period: 15s
    networks:
      - hse-network

networks:
  hse-network:
    name: ${DOCKER_NETWORK_NAME:-hse-network}
    external: true

volumes:
  hse_ai_models:
    name: hse_ai_models
    external: true
