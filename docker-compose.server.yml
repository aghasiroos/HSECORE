version: '3.8'

services:
  hse-app:
    image: hsecore-enterprise:latest
    build:
      context: .
      dockerfile: Dockerfile.prod
      args:
        - "NODE_BASE_IMAGE=${NODE_BASE_IMAGE:-node:22-alpine}"
        - "APP_VERSION=${APP_VERSION:-0.2.8}"
        - "BUILD_ID=${BUILD_ID:-local-build}"
        - "RELEASE_ID=${RELEASE_ID:-local-release}"
    container_name: hse-enterprise-app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - "NODE_ENV=production"
      - "PORT=3000"
      - "APP_PORT=3000"
      - "GEMINI_API_KEY=${GEMINI_API_KEY:-}"
      - "SQL_HOST=${SQL_HOST:-host.docker.internal}"
      - "SQL_PORT=${SQL_PORT:-5432}"
      - "SQL_USER=${SQL_USER:?SQL_USER must be set in .env}"
      - "SQL_PASSWORD=${SQL_PASSWORD:?SQL_PASSWORD must be set in .env}"
      - "SQL_DB_NAME=${SQL_DB_NAME:-hsedb}"
      - "SQL_ADMIN_USER=${SQL_ADMIN_USER:-postgres}"
      - "SQL_ADMIN_PASSWORD=${SQL_ADMIN_PASSWORD:-}"
      - "SQL_SSL=${SQL_SSL:-false}"
      - "SQL_SSL_CA=${SQL_SSL_CA:-}"
      - "SQL_SSL_REJECT_UNAUTHORIZED=${SQL_SSL_REJECT_UNAUTHORIZED:-true}"
      - "PG_MAX_POOL=${PG_MAX_POOL:-15}"
      - "PG_MIN_POOL=${PG_MIN_POOL:-2}"
      - "PG_IDLE_TIMEOUT_MS=${PG_IDLE_TIMEOUT_MS:-60000}"
      - "PG_CONN_TIMEOUT_MS=${PG_CONN_TIMEOUT_MS:-15000}"
      - "STRICT_DB_STARTUP=${STRICT_DB_STARTUP:-true}"
      - "JWT_SECRET=${JWT_SECRET:?JWT_SECRET must be set in .env}"
      - "FORECA_API_KEY=${FORECA_API_KEY:-}"
      - "FORECA_API_TOKEN=${FORECA_API_TOKEN:-}"
      - "UPLOAD_DIR=/app/uploads"
      - "AI_ENGINE_ENABLED=${AI_ENGINE_ENABLED:-true}"
      - "AI_ENGINE_URL=${AI_ENGINE_URL:-http://hse-ai-engine:11434}"
      - "AI_DEFAULT_CHAT_MODEL=${AI_DEFAULT_CHAT_MODEL:-qwen2.5:1.7b}"
      - "AI_DEFAULT_EMBED_MODEL=${AI_DEFAULT_EMBED_MODEL:-bge-m3}"
      - "AI_MAX_CONCURRENCY=${AI_MAX_CONCURRENCY:-1}"
      - "AI_REQUEST_TIMEOUT_MS=${AI_REQUEST_TIMEOUT_MS:-180000}"
      - "AI_CONTEXT_TOKENS=${AI_CONTEXT_TOKENS:-4096}"
      - "AI_MAX_QUEUE_LENGTH=${AI_MAX_QUEUE_LENGTH:-10}"
      - "AI_CLOUD_FALLBACK_ENABLED=${AI_CLOUD_FALLBACK_ENABLED:-false}"
    volumes:
      - ./data/uploads:/app/uploads
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${DOCKER_BIND_IP:-127.0.0.1}:${APP_INTERNAL_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 25s
    networks:
      - hse-network
    depends_on:
      - hse-ai-engine

  # Independent Local AI Engine (Ollama - Offline CPU Inference)
  hse-ai-engine:
    image: ollama/ollama:latest
    container_name: hse-ai-engine
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - "OLLAMA_HOST=0.0.0.0:11434"
      - "OLLAMA_NUM_PARALLEL=${AI_NUM_PARALLEL:-1}"
      - "OLLAMA_MAX_LOADED_MODELS=${AI_MAX_LOADED_MODELS:-1}"
      - "OLLAMA_KEEP_ALIVE=${AI_KEEP_ALIVE:-15m}"
      - "OLLAMA_FLASH_ATTENTION=0"
      # Keep Ollama HTTP API private to the Docker network; wildcard CORS is not needed.
      - "OMP_NUM_THREADS=${AI_CPU_THREADS:-8}"
    volumes:
      - hse_ai_models:/root/.ollama
    expose:
      - "11434"
    ports:
      - "${AI_BIND_IP:-127.0.0.1}:${AI_HOST_PORT:-11434}:11434"
    deploy:
      resources:
        limits:
          cpus: "${AI_CPU_LIMIT:-6.0}"
          memory: "${AI_MEMORY_LIMIT:-4608M}"
        reservations:
          cpus: "1.0"
          memory: "1024M"
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 8s
      retries: 3
      start_period: 15s
    networks:
      - hse-network

  # Optional containerized PostgreSQL (strictly disabled in default VPS host PostgreSQL architecture; requires explicit --profile container-db)
  postgres:
    image: postgres:16-alpine
    container_name: hse-postgres
    restart: unless-stopped
    profiles:
      - container-db
    command:
      - "postgres"
      - "-c"
      - "shared_buffers=512MB"
      - "-c"
      - "effective_cache_size=1536MB"
      - "-c"
      - "maintenance_work_mem=128MB"
      - "-c"
      - "checkpoint_completion_target=0.9"
      - "-c"
      - "wal_buffers=16MB"
      - "-c"
      - "default_statistics_target=100"
      - "-c"
      - "random_page_cost=1.1"
      - "-c"
      - "effective_io_concurrency=200"
      - "-c"
      - "work_mem=16MB"
      - "-c"
      - "min_wal_size=1GB"
      - "-c"
      - "max_wal_size=4GB"
      - "-c"
      - "max_connections=150"
      - "-c"
      - "tcp_keepalives_idle=60"
      - "-c"
      - "tcp_keepalives_interval=10"
      - "-c"
      - "tcp_keepalives_count=5"
      - "-c"
      - "synchronous_commit=on"
    environment:
      - "POSTGRES_DB=${SQL_DB_NAME:-hsedb}"
      - "POSTGRES_USER=${SQL_USER:?SQL_USER must be set in .env}"
      - "POSTGRES_PASSWORD=${SQL_PASSWORD:?SQL_PASSWORD must be set in .env}"
    volumes:
      - hse_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${SQL_USER:-hse_user} -d ${SQL_DB_NAME:-hsedb}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    networks:
      - hse-network

networks:
  hse-network:
    driver: bridge

volumes:
  hse_postgres_data:
    driver: local
  hse_ai_models:
    name: hse_ai_models
    driver: local
