global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'hse-enterprise-monitoring'

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'spring-boot-app'
    metrics_path: '/actuator/prometheus'
    scrape_interval: 5s
    static_configs:
      - targets: ['spring-boot-app:8080']

  - job_name: 'camunda-zeebe'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['camunda-zeebe:9600']

  - job_name: 'keycloak'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['keycloak:8080']

  - job_name: 'minio'
    metrics_path: '/minio/v2/metrics/cluster'
    static_configs:
      - targets: ['minio:9000']
