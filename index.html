    <script>
      (function() {
        var NativeWebSocket = window.WebSocket;
        if (NativeWebSocket) {
          window.WebSocket = function(url, protocols) {
            var isViteHmr = protocols === 'vite-hmr' || (typeof url === 'string' && (url.indexOf('token=') !== -1 || url.indexOf('vite-hmr') !== -1));
            if (isViteHmr) {
              var listeners = {};
              var dummy = {
                readyState: 1,
                OPEN: 1,
                CONNECTING: 0,
                CLOSING: 2,
                CLOSED: 3,
                url: String(url || ''),
                protocol: 'vite-hmr',
                extensions: '',
                bufferedAmount: 0,
                binaryType: 'blob',
                onopen: null,
                onclose: null,
                onerror: null,
                onmessage: null,
                send: function() {},
                close: function() {},
                addEventListener: function(event, cb) {
                  if (!listeners[event]) listeners[event] = [];
                  listeners[event].push(cb);
                  if (event === 'open') {
                    setTimeout(function() {
                      try { cb({ type: 'open', target: dummy }); } catch (_) {}
                    }, 0);
                  }
                },
                removeEventListener: function(event, cb) {
                  if (listeners[event]) {
                    listeners[event] = listeners[event].filter(function(fn) { return fn !== cb; });
                  }
                },
                dispatchEvent: function() { return true; }
              };
              return dummy;
            }
            return new NativeWebSocket(url, protocols);
          };
          window.WebSocket.prototype = NativeWebSocket.prototype;
          window.WebSocket.CONNECTING = NativeWebSocket.CONNECTING;
          window.WebSocket.OPEN = NativeWebSocket.OPEN;
          window.WebSocket.CLOSING = NativeWebSocket.CLOSING;
          window.WebSocket.CLOSED = NativeWebSocket.CLOSED;
        }

        window.addEventListener('unhandledrejection', function(event) {
          var reason = event && event.reason;
          var msg = String((reason && (reason.message || reason)) || '');
          if (
            msg.indexOf('WebSocket') !== -1 ||
            msg.indexOf('websocket') !== -1 ||
            (reason && reason.response && reason.response.status === 401) ||
            msg.indexOf('401') !== -1
          ) {
            event.preventDefault();
            if (event.stopImmediatePropagation) event.stopImmediatePropagation();
          }
        }, true);

        var _err = console.error;
        console.error = function() {
          var first = arguments[0];
          var msg = typeof first === 'string' ? first : (first && first.message ? first.message : '');
          if (typeof msg === 'string' && (msg.indexOf('[vite] failed to connect') !== -1 || msg.indexOf('WebSocket closed without opened') !== -1)) {
            return;
          }
          _err.apply(console, arguments);
        };
      })();
    </script>
