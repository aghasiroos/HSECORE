    <!-- Neutralize Vite HMR WebSocket in Cloud Sandbox / IFrame environment -->
    <script>
      (function() {
        if (typeof window === 'undefined') return;
        var RealWebSocket = window.WebSocket;
        if (!RealWebSocket) return;

        function DummyHmrWebSocket(url) {
          var target = new EventTarget();
          target.url = String(url || '');
          target.readyState = 1; // WebSocket.OPEN
          target.bufferedAmount = 0;
          target.extensions = '';
          target.protocol = 'vite-hmr';
          target.binaryType = 'blob';
          target.onopen = null;
          target.onclose = null;
          target.onerror = null;
          target.onmessage = null;
          target.send = function() {};
          target.close = function() {
            target.readyState = 3;
            var ev = new Event('close');
            ev.wasClean = true;
            ev.code = 1000;
            target.dispatchEvent(ev);
            if (typeof target.onclose === 'function') target.onclose(ev);
          };

          setTimeout(function() {
            var openEv = new Event('open');
            target.dispatchEvent(openEv);
            if (typeof target.onopen === 'function') target.onopen(openEv);
          }, 0);

          return target;
        }

        function InterceptedWebSocket(url, protocols) {
          var isViteHmr = 
            protocols === 'vite-hmr' ||
            (Array.isArray(protocols) && protocols.indexOf('vite-hmr') !== -1) ||
            (typeof url === 'string' && (url.indexOf('vite-hmr') !== -1 || (url.indexOf('token=') !== -1 && url.indexOf(':3000') !== -1)));

          if (isViteHmr) {
            return DummyHmrWebSocket(url);
          }
          if (protocols !== undefined) {
            return new RealWebSocket(url, protocols);
          }
          return new RealWebSocket(url);
        }

        InterceptedWebSocket.prototype = RealWebSocket.prototype;
        InterceptedWebSocket.CONNECTING = 0;
        InterceptedWebSocket.OPEN = 1;
        InterceptedWebSocket.CLOSING = 2;
        InterceptedWebSocket.CLOSED = 3;

        window.WebSocket = InterceptedWebSocket;
      })();
    </script>

    <script>
      (function() {
        // Prevent benign third-party library deprecations and sandbox environment messages from polluting the developer console
        var benignWarnPatterns = [
          'defaultProps will be removed',
          'The width(0) and height(0)',
          'of chart should be greater than 0',
          'minWidth(0) or minHeight',
          'SafeStorage',
          'quota',
          'AudioContext',
          'speechSynthesis',
          'Text-to-speech',
          'GPS tracking',
          'Anonymous session auth note',
          'fallback to local',
          'fallback:',
          'ServiceWorker',
          'IndexedDB'
        ];

        var benignErrorPatterns = [
          'WebSocket',
          'ws:',
          '[vite] failed to connect',
          'closed without opened',
          'net::ERR_CONNECTION_REFUSED',
          'Missing or insufficient permissions',
          'permission-denied',
          'cssRules',
          'CSSStyleSheet',
          'Failed to fetch dynamically imported module'
        ];

        var benignInfoPatterns = [
          'Download the React DevTools',
          '[vite]',
          'socket.io',
          'engine.io',
          'HSE Audio Alert Note',
          'AudioContext',
          'Storage purge',
          'The width(0) and height(0)'
        ];

        function wrapConsoleMethod(origFn, patterns) {
          if (typeof origFn !== 'function') return origFn;
          return function() {
            var text = Array.prototype.slice.call(arguments).map(function(item) {
              return typeof item === 'string' ? item : (item && item.message) || '';
            }).join(' ');
            for (var i = 0; i < patterns.length; i++) {
              if (text.indexOf(patterns[i]) !== -1) return;
            }
            origFn.apply(console, arguments);
          };
        }

        console.warn = wrapConsoleMethod(console.warn, benignWarnPatterns);
        console.error = wrapConsoleMethod(console.error, benignErrorPatterns);
        console.info = wrapConsoleMethod(console.info, benignInfoPatterns);
        console.debug = wrapConsoleMethod(console.debug, benignInfoPatterns);
        console.log = wrapConsoleMethod(console.log, benignInfoPatterns);

        var isBenign = function(item) {
          if (!item) return false;
          var text = typeof item === 'string' ? item : ((item.message || '') + ' ' + (item.stack || '') + ' ' + String(item));
          for (var i = 0; i < benignErrorPatterns.length; i++) {
            if (text.indexOf(benignErrorPatterns[i]) !== -1) return true;
          }
          return false;
        };

        window.addEventListener('unhandledrejection', function(event) {
          var reason = event && event.reason;
          if (isBenign(reason)) {
            if (event.preventDefault) event.preventDefault();
            if (event.stopImmediatePropagation) event.stopImmediatePropagation();
            return true;
          }
        }, true);

        window.addEventListener('error', function(event) {
          var msg = event && (event.message || (event.error && (event.error.message || event.error.stack)) || '');
          if (isBenign(msg)) {
            if (event.preventDefault) event.preventDefault();
            if (event.stopImmediatePropagation) event.stopImmediatePropagation();
            return true;
          }
        }, true);

        // Remove any injected Vite error overlay node immediately
        if (typeof MutationObserver !== 'undefined') {
          var observer = new MutationObserver(function(mutations) {
            for (var m = 0; m < mutations.length; m++) {
              var nodes = mutations[m].addedNodes;
              for (var n = 0; n < nodes.length; n++) {
                var node = nodes[n];
                if (node && node.nodeType === 1) {
                  if (node.tagName === 'VITE-ERROR-OVERLAY' || (node.id && node.id.indexOf('vite-error') !== -1)) {
                    node.remove();
                  }
                }
              }
            }
          });
          document.addEventListener('DOMContentLoaded', function() {
            observer.observe(document.body || document.documentElement, { childList: true, subtree: true });
          });
        }
      })();
    </script>
